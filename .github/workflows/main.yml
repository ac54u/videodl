name: Python Application Check

# 触发条件：当代码推送到 master 分支时自动运行
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # 使用 GitHub 提供的最新 Ubuntu 虚拟机

    steps:
    - name: Check out repository
      uses: actions/checkout@v4 # 把你的代码拉取到虚拟机里

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" # 安装指定的 Python 版本

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装你项目所需的依赖
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install requests

    - name: Check Python Syntax
      run: |
        # 测试你的核心脚本是否存在低级语法错误
        python -m py_compile videodl/modules/sources/youtube.py
